<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f2815">
  <title>온라인 웨딩 홀 · 하객 입장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ 1. 하객 캐릭터 만들기 (청첩장 위에 뜨는 바텀시트) ============ -->
  <main class="screen screen-create active" id="screenCreate">

    <!-- 뒤에 비쳐 보이는 모바일 청첩장 -->
    <div class="invite-backdrop" aria-hidden="true">
      <div class="invite-box"></div>
      <p class="invite-poem">
        저절로 웃음이 났다.<br>
        웃는 남자를 보고 여자도 웃었다.<br>
        그렇게 서로의 웃음이 되어<br>
        평생을 함께 걷기로 했습니다.
      </p>
      <img class="invite-couple" src="assets/couple.png" alt="">
    </div>
    <div class="sheet-dim"></div>

    <section class="sheet" id="sheet" role="dialog" aria-label="하객 캐릭터 만들기">
      <div class="sheet-scroll">
        <div class="grabber"></div>

        <div class="preview" aria-live="polite">
          <div class="preview-doll" id="previewDoll"></div>
          <p class="preview-empty" id="previewEmpty">성별을 고르면<br>캐릭터가 나타나요</p>
          <p class="preview-name" id="previewName" hidden></p>
        </div>

        <form id="createForm" autocomplete="off" novalidate>
          <!-- 0. 구분 -->
          <div class="side-cards" id="sideChips"></div>

          <!-- 1. 성별 -->
          <section class="field">
            <h2>성별</h2>
            <div class="pills" id="genderChips"></div>
          </section>

          <div class="gender-dependent" id="genderDependent" hidden>
            <!-- 2. 피부톤 -->
            <section class="field">
              <h2>피부톤</h2>
              <div class="pills" id="skinChips"></div>
            </section>
            <!-- 3. 헤어스타일 -->
            <section class="field">
              <h2>헤어스타일</h2>
              <div class="pills" id="hairChips"></div>
            </section>
            <!-- 4. 상의 -->
            <section class="field">
              <h2>상의</h2>
              <div class="pills" id="topChips"></div>
            </section>
            <!-- 5. 하의 · 신발 -->
            <section class="field">
              <h2>하의 · 신발</h2>
              <div class="pills" id="bottomChips"></div>
            </section>
            <!-- 6. 소품 -->
            <section class="field">
              <h2>소품</h2>
              <div class="pills" id="propChips"></div>
            </section>
          </div>

          <!-- 7. 닉네임 -->
          <section class="field">
            <input class="input" id="nickInput" type="text" maxlength="8" placeholder="닉네임 (최대 8자)" enterkeyhint="next" aria-label="닉네임">
          </section>
          <!-- 8. 축하 메시지 -->
          <section class="field">
            <textarea class="input" id="msgInput" rows="2" maxlength="60" placeholder="축하 메시지를 남겨주세요" aria-label="축하 메시지"></textarea>
            <p class="counter"><span id="msgCount">0</span> / 60</p>
          </section>

          <div class="cta-spacer"></div>
        </form>
      </div>

      <div class="cta-bar">
        <p class="hint" id="formHint" role="alert"></p>
        <button type="submit" form="createForm" class="cta" id="enterBtn"><span class="wand">🪄</span> 지정석 배정받고 예식장 입장하기</button>
      </div>
    </section>
  </main>

  <!-- ============ 2. 예식장 홀 ============ -->
  <section class="screen screen-hall" id="screenHall" aria-label="예식장 홀">

    <!-- 2.5D 홀 (Three.js). WebGL/라이브러리를 못 쓰면 아래 2D 홀로 자동 전환 -->
    <div class="hall3d" id="hall3d"><div class="bubbles3d" id="bubbles3d"></div></div>

    <!-- 2D 홀 (예비용) -->
    <div class="hall-scroll" id="hallScroll">
      <div class="world-wrap" id="worldWrap">
        <div class="world" id="world">
          <img class="hall-bg" src="assets/chapel-hall.jpg" alt="" width="768" height="1344" draggable="false">
          <div class="plaza"></div>
          <img class="couple" src="assets/couple.png" alt="신랑 신부" draggable="false">
          <div id="pewLayer"></div>
          <div class="door" id="door">
            <div class="door-gap"></div>
            <div class="door-leaf left"></div>
            <div class="door-leaf right"></div>
          </div>
          <svg class="route" id="route" viewBox="0 0 768 1500" aria-hidden="true">
            <defs>
              <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L8,4 L0,8 z" fill="#d83a2e"/>
              </marker>
            </defs>
            <path d="M54 1452 L385 1452 L385 1306" fill="none" stroke="#d83a2e" stroke-width="7"
                  stroke-dasharray="16 12" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowHead)"/>
          </svg>
          <div id="guestLayer"></div>
          <div id="bubbleLayer"></div>
        </div>
      </div>
    </div>

    <nav class="hall-bar">
      <a class="px btn back" id="btnBack" href="#">← 청첩장으로</a>
      <button type="button" class="px btn gold" id="btnBook">✨ 하객 <span id="guestCount">0</span>명 입장</button>
    </nav>

    <p class="toast" id="toast" hidden></p>
  </section>

  <!-- ============ 3. 하객 방명록 모달 ============ -->
  <div class="modal" id="bookModal" hidden>
    <div class="modal-dim" data-close></div>
    <div class="modal-card px" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
      <header class="modal-head">
        <h2 id="bookTitle">하객 방명록</h2>
        <button type="button" class="px btn small" id="bookClose" aria-label="닫기">✕</button>
      </header>
      <ol class="book-list" id="bookList"></ol>
      <p class="book-empty" id="bookEmpty" hidden>아직 입장한 하객이 없어요</p>
    </div>
  </div>

</div>

<!-- 2.5D 렌더링용 Three.js (CDN). 오프라인이면 자동으로 2D 홀을 사용합니다 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
